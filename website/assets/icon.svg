<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="uav-grad-primary" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="uav-grad-cyan" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Precision UAV Flight Reticle / Bounding Corners -->
  <path d="M5 14V7a2 2 0 0 1 2-2h7" stroke="url(#uav-grad-cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 5h7a2 2 0 0 1 2 2v7" stroke="url(#uav-grad-cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 30v7a2 2 0 0 1-2 2h-7" stroke="url(#uav-grad-cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 39H7a2 2 0 0 1-2-2v-7" stroke="url(#uav-grad-cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Optical sensor reticle ring -->
  <circle cx="22" cy="22" r="13" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Aerial Geolocation Beacon Pin -->
  <path d="M22 8C16.8 8 12.5 12.3 12.5 17.5c0 6.6 8.5 15.8 9.1 16.5a.6.6 0 0 0 .8 0c.6-.7 9.1-9.9 9.1-16.5C31.5 12.3 27.2 8 22 8z" fill="url(#uav-grad-primary)" filter="url(#glow)"/>

  <!-- Precision House Number Plate Badge (enclosed in pin) -->
  <rect x="17" y="13.5" width="10" height="7.5" rx="1.5" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
  <!-- Optical sensor crosshair target (Clean, no digits or confusing numbers) -->
  <circle cx="22" cy="17.25" r="1.5" fill="#c2410c"/>
  <line x1="19.2" y1="17.25" x2="24.8" y2="17.25" stroke="#0f2438" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="22" y1="14.8" x2="22" y2="19.7" stroke="#0f2438" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Telemetry alignment ticks -->
  <line x1="22" y1="2" x2="22" y2="4.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="39.5" x2="22" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="22" x2="4.5" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="39.5" y1="22" x2="42" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>